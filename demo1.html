<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Scroll Controlled Video</title>
  <style>
    /* Reset margins and set background */
    body {
      margin: 0;
      background-image: url(https://storage.googleapis.com/stagecloud/AUBG-Large.png);
      background-size: cover;
      background-repeat: no-repeat;
      font-family: sans-serif;
      background-attachment: fixed;
    }

    /* Creates scrollable space. Larger height = slower video playback. */
    .scroll-container {
      height: 400vh; 
      overflow: hidden;
    }

    /* Pins the video to the viewport */
    video {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100vh;
      object-fit: fill;
      z-index: 1;
    }

    #v1 {
      z-index: 2;
      opacity: 0;
      transition: opacity 0.3s ease;
      pointer-events: none;
    }

    #close-btn {
      position: fixed;
      top: 20px;
      right: 20px;
      z-index: 3;
      padding: 10px 15px;
      font-size: 20px;
      color: white;
      background: rgba(0, 0, 0, 0.5);
      border: none;
      border-radius: 5px;
      cursor: pointer;
      opacity: 0;
      transition: opacity 0.3s ease;
      pointer-events: none;
    }

    /* Optional overlay text to show scroll depth */
    .overlay-text {
      position: fixed;
      bottom: 20px;
      left: 20px;
      color: #fff;
      font-size: 24px;
      z-index: 2;
      background: rgba(0,0,0,0.5);
      padding: 10px;
      border-radius: 5px;
      pointer-events: none;
    }
    &::-webkit-scrollbar {
    display: none;
  }
  </style>
</head>
<body>

  <!-- Scroll container holds the scroll height -->
  <div class="scroll-container">
    <!-- Video element pinned to the screen -->
    <video id="v0" tabindex="0" autobuffer preload="auto" muted playsinline>
      <source type="video/mp4" src="https://storage.googleapis.com/stagecloud/Sparsh_Pearl_CP_Bath_Fittings_Launch_by_Saif_Ali_Khan_11_202607291639_alpha-1.webm">
    </video>
    <video id="v1" tabindex="0" autobuffer preload="auto" muted playsinline>
      <source type="video/mp4" src="https://storage.googleapis.com/stagecloud/grok-video-93a307e9-07e7-4d79-9dde-662eecc6659d.mp4">
    </video>
    <button id="close-btn">X</button>
    <div class="overlay-text" id="status">Scroll down to play</div>
  </div>

  <script>
    const video = document.getElementById("v0");
    const video2 = document.getElementById("v1");
    const closeBtn = document.getElementById("close-btn");

let targetTime = 0;
let currentTime = 0;
const accel = 0.08; // Slightly lower for Chrome hardware smoothing
let isVideo2Playing = false;

window.addEventListener("scroll", () => {
  const scrollTop = window.scrollY;
  const maxScroll = document.documentElement.scrollHeight - window.innerHeight;
  const scrollFraction = scrollTop / maxScroll;

  if (video.duration) {
    targetTime = scrollFraction * video.duration;
  }

  if (scrollFraction >= 0.99) {
    if (!isVideo2Playing) {
      video2.style.opacity = 1;
      closeBtn.style.opacity = 1;
      closeBtn.style.pointerEvents = "auto";
      video2.currentTime = 0;
      video2.play().catch(e => console.log(e));
      isVideo2Playing = true;
    }
  } else {
    if (isVideo2Playing) {
      video2.style.opacity = 0;
      closeBtn.style.opacity = 0;
      closeBtn.style.pointerEvents = "none";
      video2.pause();
      isVideo2Playing = false;
    }
  }
});

closeBtn.addEventListener("click", () => {
  const maxScroll = document.documentElement.scrollHeight - window.innerHeight;
  window.scrollTo({
    top: maxScroll * 0.98,
    behavior: 'smooth'
  });
});

function updateVideo() {
  // CRITICAL FIX: If Chrome is still loading the previous frame, skip this loop iteration
  if (video.seeking) {
    requestAnimationFrame(updateVideo);
    return;
  }

  // Smooth out the timeline jump
  currentTime += (targetTime - currentTime) * accel;
  
  if (video.duration) {
    // Only update if the difference is noticeable (prevents micro-stutter)
    if (Math.abs(currentTime - video.currentTime) > 0.01) {
      video.currentTime = currentTime;
    }
  }
  
  requestAnimationFrame(updateVideo);
}

video.addEventListener("loadedmetadata", () => {
  requestAnimationFrame(updateVideo);
});

  </script>
</body>
</html>
